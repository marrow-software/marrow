name: Marketing site — CI + deploy

on:
  push:
    branches: [main]
    paths:
      - "web-marketing/**"
  pull_request:
    paths:
      - "web-marketing/**"
  # Manual trigger — deploy without needing a web-marketing/ change to trip the
  # path filter (e.g. re-deploying after a workflow fix landed elsewhere).
  workflow_dispatch:

jobs:
  lint-build:
    name: Lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-marketing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: lint-build
    # Deploy on pushes to main or a manual dispatch — never on PRs.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: web-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web-marketing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build for Cloudflare Pages
        run: npm run pages:build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          workingDirectory: web-marketing
          command: pages deploy out --project-name=marrow-marketing
