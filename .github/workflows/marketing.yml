name: Marketing site — CI + deploy

on:
  push:
    branches: [main]
    paths:
      - "web-marketing/**"
  pull_request:
    paths:
      - "web-marketing/**"

jobs:
  lint-build:
    name: Lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-marketing/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: lint-build
    # Only deploy on pushes to main, not on PRs.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: web-marketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-marketing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build for Cloudflare Pages
        run: npm run pages:build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web-marketing
          command: pages deploy out --project-name=marrow-marketing
