# Cloudflare Workers config for the Marrow web app (app.marrow.so).
# Deployed via @opennextjs/cloudflare (supports Next.js 16+).
#
# Build:
#   npm run pages:build          # CLOUDFLARE_BUILD=1 opennextjs-cloudflare build
# Deploy:
#   npm run pages:deploy         # wrangler deploy
#
# DNS (marrow.so zone is already on Cloudflare):
#   app.marrow.so   CNAME  marrow-web.<account>.workers.dev  (proxied)
#
# Custom domain is configured in the Cloudflare Workers dashboard after first deploy.
#
# NEXT_PUBLIC_* vars must be set as env vars at build time in CI (not as wrangler [vars],
# which are runtime-only). Set them in the release.yml build step or Pages dashboard env.

name = "marrow-web"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

[assets]
directory = ".open-next/assets"
binding = "ASSETS"
