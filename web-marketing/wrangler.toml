# Cloudflare Pages config for the Marrow marketing site (marrow.so + www.marrow.so).
#
# Build:
#   npm run pages:build          # runs next-on-pages against next.config.pages.ts
# Deploy:
#   npm run pages:deploy         # wrangler pages deploy .vercel/output/static
#
# DNS (requires #76 — Cloudflare DNS delegation):
#   marrow.so       CNAME  marrow-marketing.pages.dev   (proxied)
#   www.marrow.so   CNAME  marrow-marketing.pages.dev   (proxied)
#
# Custom domains are configured in the Cloudflare Pages dashboard after the project is created.

name = "marrow-marketing"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"
