app = "marrow-api"
primary_region = "iad"   # US East — closest to Neon's default region

[build]
image = "ghcr.io/marrow-software/marrow-api:latest"   # overridden to the exact tag at deploy time

[deploy]
# Run migrations in a temporary machine (same image + secrets) before traffic
# shifts; a failure here aborts the deploy. Uses the DATABASE_URL secret, which
# alembic/env.py resolves into sqlalchemy.url.
release_command = "alembic upgrade head"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 1   # keep one warm; avoids cold-start latency for users

  [[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
size = "shared-cpu-1x"
memory = "256mb"

[env]
CORS_ORIGINS      = "https://app.marrow.so"
FRONTEND_URL      = "https://app.marrow.so"
COOKIE_DOMAIN     = ".marrow.so"
STORAGE_BACKEND   = "r2"
SAAS_MODE         = "true"
OIDC_ISSUER       = "https://dev-cjafzt7x7ozoltln.us.auth0.com/"
OIDC_CLIENT_ID    = "ZKCgLWAHJShCpA4eqpoyCRj0rH13HC42"
OIDC_REDIRECT_URI = "https://api.marrow.so/api/auth/callback"
STRIPE_STARTER_PRICE_MONTHLY      = "price_1TeUDEBpYG35ummTRMdkOIrz"
