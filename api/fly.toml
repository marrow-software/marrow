# Secrets — configure via `flyctl secrets set -a marrow-api` (never store values here):
#   SECRET_KEY                 # 64-char random string
#   DATABASE_URL               # Neon pooled connection URL
#   R2_ENDPOINT_URL            # https://<account-id>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
#   R2_BUCKET                  # marrow-attachments
#   OIDC_CLIENT_SECRET         # Auth0 client secret
#   STRIPE_SECRET_KEY          # sk_live_ or sk_test_
#   STRIPE_WEBHOOK_SECRET      # whsec_... (set after first deploy)
#   LICENSE_SIGNING_KEY        # 64-char random string
